<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Travel Website</title>

    <!-- bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Swiper -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/swiper/swiper-bundle.min.css"
    />

    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Option 1: Include in HTML -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css"
    />

    <!-- RTL Bootstrap  -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css"
      integrity="sha384-CfCrinSRH2IR6a4e6fy2q6ioOX7O6Mtm1L9vRvFZ1trBncWmMePhzvafv7oIcWiW"
      crossorigin="anonymous"
    />

    <!-- CSS Files -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/hero.css" />
    <link rel="stylesheet" href="css/services.css" />
    <link rel="stylesheet" href="css/destinations.css" />
    <link rel="stylesheet" href="css/booking.css" />
    <link rel="stylesheet" href="css/testimonials.css" />
    <link rel="stylesheet" href="css/partners.css" />
    <link rel="stylesheet" href="css/contact.css" />
    <link rel="stylesheet" href="css/footer.css" />
  </head>

  <body data-theme="light">
    <!-- Navbar -->
    <div id="navbar"></div>

    <!-- Hero Section -->
    <div id="hero"></div>

    <!-- Category Section -->
    <div id="category"></div>

    <!-- Destinations Section -->
    <div id="destinations"></div>

    <!-- Booking Section -->
    <div id="booking"></div>

    <!-- Testimonials Section -->
    <div id="testimonials"></div>

    <!-- Partners Section -->
    <div id="partners"></div>

    <!-- Contact Section -->
    <div id="contact"></div>

    <!-- Footer -->
    <div id="footer"></div>

    <!-- Scripts -->
    <script src="https://unpkg.com/i18next@23.4.6/dist/umd/i18next.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <script>
      const loadSection = (elementId, file) => {
        return fetch(`sections/${file}.html`)
          .then((response) => response.text())
          .then((html) => {
            document.getElementById(elementId).innerHTML = html;
          })
          .catch((error) => console.error("Error loading section:", error));
      };

      Promise.all([
        loadSection("navbar", "navbar"),
        loadSection("hero", "hero"),
        loadSection("category", "category"),
        loadSection("destinations", "destinations"),
        loadSection("booking", "booking"),
        loadSection("testimonials", "testimonials"),
        loadSection("partners", "partners"),
        loadSection("contact", "contact"),
        loadSection("footer", "footer"),
      ]).then(() => {
        initScripts();
      });

      function initScripts() {
        const script = document.createElement("script");
        script.src = "./js/script.js";
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>

<section class="contact-section py-5">
  <div class="container position-relative">
    <img src="images/send.png" alt="telegram" class="telegram-icon" />
    <div class="contact-box text-center mx-auto">
      <h3 class="fw-bold mb-4" data-i18n="contact.title">
        Subscribe to get information, latest news and other interesting offers
        about Jadoo
      </h3>
      <form
        class="d-flex justify-content-center align-items-center flex-wrap gap-2"
      >
        <div class="input-group input-group-lg email-group">
          <span class="input-group-text bg-white border-end-0">
            <img src="images/mail.svg" alt="email icon" width="18" />
          </span>
          <input
            type="email"
            class="form-control border-start-0"
            placeholder="Your email"
            aria-label="Email"
          />
        </div>
        <button class="btn btn-accent btn-lg ms-2" type="submit">
          Subscribe
        </button>
      </form>
    </div>
  </div>
</section>
